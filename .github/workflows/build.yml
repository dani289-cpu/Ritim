name: Build Ritim APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Ritim project
        run: |
          mkdir -p buildsrc
          unzip -q Ritim-Android-Player.zip -d buildsrc

      - name: Build APK
        working-directory: buildsrc/android
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ritim-debug-apk
          path: buildsrc/android/app/build/outputs/apk/debug/app-debug.apk
